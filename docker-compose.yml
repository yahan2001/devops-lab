services:
  app:
    build: .
    image: devops-lab:1.0
    container_name: devops-compose
    ports:
      - "8082:8080"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:3
    container_name: devops-zipkin
    ports:
      - "9411:9411"
